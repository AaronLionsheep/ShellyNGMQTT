name: Compile Dependencies

on:
  pull_request:
    #paths:
    #  - "ShellyNGMQTT.indigoPlugin/Contents/Server Plugin/requirements.txt"

defaults:
  run:
    shell: bash

jobs:
  cryptography:
    name: Cryptography
    strategy:
      fail-fast: false
      matrix:
        python: [3.11, 3.13]
    runs-on: macos-26-intel
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Compile
        run: |
          PACKAGE=$(grep -E "^cryptography==[0-9\.]+$" "ShellyNGMQTT.indigoPlugin/Contents/Server Plugin/requirements.txt")
          pip wheel --wheel-dir=wheels --no-deps $PACKAGE

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: cryptography-${{ matrix.python }}
          path: wheels/*.whl