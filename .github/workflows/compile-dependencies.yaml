name: Compile Dependencies

on:
  pull_request:
    #paths:
    #  - "ShellyNGMQTT.indigoPlugin/Contents/Server Plugin/requirements.txt"

defaults:
  run:
    shell: bash

jobs:
  cryptography:
    name: Cryptography
    strategy:
      fail-fast: false
      matrix:
        python: [3.11, 3.13]
    runs-on: macos-26
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: brew install openssl@3 rust

      - name: Compile
        env:
          ARCHFLAGS: "-arch arm64 -arch x86_64"
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          PKG_CONFIG_ALLOW_CROSS: "1"
        run: |
          PACKAGE=$(grep -E "^cryptography==[0-9\.]+$" "ShellyNGMQTT.indigoPlugin/Contents/Server Plugin/requirements.txt")
          pip wheel --wheel-dir=wheels --no-deps --no-binary cryptography $PACKAGE

      - name: Upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cryptography-${{ matrix.python }}
          path: wheels/*.whl

  merge:
    name: Merge Outputs
    runs-on: ubuntu-latest
    needs:
      - cryptography
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v7.0.2
        with:
          name: wheels
          delete-merged: true