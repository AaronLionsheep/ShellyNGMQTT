name: Test

on:
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  unit:
    name: Unit Tests
    strategy:
      fail-fast: false
      matrix:
        python: [3.11, 3.13]
    # The tests are platform-independent, so they run on Linux; macOS installs are checked by the Dependencies workflow
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: pip install -r "ShellyNGMQTT.indigoPlugin/Contents/Server Plugin/requirements.txt" "pytest>=9" pytest-cov git+https://github.com/AaronLionsheep/pytest-indigo.git@0.2.0

      - name: Test
        run: pytest
        env:
          COVERAGE_FILE: .coverage.${{ matrix.python }}

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.python }}
          path: .coverage.${{ matrix.python }}
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    name: Coverage
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 5
    steps:
      # diff-cover compares against the base branch, so it needs the full history
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.13

      - name: Install coverage
        run: pip install coverage

      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true

      # Every matrix job checks out to the same path, so the data files combine without path remapping
      - name: Combine coverage
        run: |
          coverage combine
          coverage xml
          echo "## Total Coverage" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      # Reports coverage of the lines this pull request changes; no threshold is enforced yet
      - name: Diff coverage
        uses: Affanmir/diff-cover-action@0c892dd61c33b7bc2de45669677d23ede3e145fa # v2.2.0
        with:
          coverage-files: coverage.xml
          compare-branch: origin/${{ github.base_ref }}
          summary-title: Diff Coverage

  lockfile:
    name: Lockfile Up to Date
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      # Existing pins are kept, so this only fails when requirements.in changed without regenerating requirements.txt
      - name: Check requirements.txt matches requirements.in
        run: |
          scripts/compile-requirements.sh
          git diff --exit-code
