name: Test

on:
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  unit:
    name: Unit Tests
    strategy:
      fail-fast: false
      matrix:
        python: [3.11, 3.13]
    # The tests are platform-independent, so they run on Linux; macOS installs are checked by the Dependencies workflow
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: pip install -r "ShellyNGMQTT.indigoPlugin/Contents/Server Plugin/requirements.txt" "pytest>=9" pytest-cov git+https://github.com/AaronLionsheep/pytest-indigo.git@0.2.0

      - name: Test
        run: pytest

  lockfile:
    name: Lockfile Up to Date
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      # Existing pins are kept, so this only fails when requirements.in changed without regenerating requirements.txt
      - name: Check requirements.txt matches requirements.in
        run: |
          scripts/compile-requirements.sh
          git diff --exit-code
