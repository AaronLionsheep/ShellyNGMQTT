  install-dependencies:
    name: Install Dependencies
    strategy:
      matrix:
        os: [macos-26, macos-26-intel]
        python: [3.11, 3.13]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ matrix.python }}

    - name: Install dependencies
      run: |
        pip install -r "ShellyNGMQTT.indigoPlugin/Contents/Server Plugin/requirements.txt" --report install.json

    # Require all packages from from pre-build wheels, except for bluetooth-data-tools and PyRIC
    # - A package that no longer provides a binary should be investigated (ex: openssl dropping macos-x64 support)
    # - A new package that does not include a binary should be known since this may complicate plugin installation
    - name: Audit dependencies built from source
      run: |
        jq '.install[] | select(.download_info.url | endswith(".whl") | not) | .metadata.name' install.json
